version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: impulsos-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - impulsos-network

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: impulsos-backend
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/impulsos-clone
    ports:
      - "5000:5000"
    networks:
      - impulsos-network
    restart: unless-stopped

  # Python Discord Bot
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: impulsos-bot
    depends_on:
      - backend
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BACKEND_URL: http://backend:5000
    networks:
      - impulsos-network
    restart: unless-stopped

  # Node.js Puppeteer Scraper
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: impulsos-scraper
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
      DEBUG: ${DEBUG:-false}
    networks:
      - impulsos-network
    restart: unless-stopped

  # React Frontend (optional - for development)
  frontend:
    image: node:18-alpine
    container_name: impulsos-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    networks:
      - impulsos-network

volumes:
  mongo_data:

networks:
  impulsos-network:
    driver: bridge
